<body class="journal-body reserve-body">

<header class="journal-bar">
  <a class="journal-wordmark" href="/zh/">
    <span>预订</span>
    <em>在我们其中一家店订一张桌子</em>

<main class="reserve-mount">

  <section class="reserve-hero">
    <span class="reserve-eyebrow">预订 · 八打灵再也</span>
    <h1>预订<i>座位</i>。</h1>
    <p class="reserve-lede">
      选一家店、一个日期、一个时间和人数。我们用 WhatsApp 跟你确认，通常在一小时内。下方灰色的是休息日。
    </p>
  </section>

  <form class="reserve-form" novalidate>

    <fieldset class="reserve-field">
      <legend>哪一家？</legend>
      <div class="bar-chips" role="radiogroup">
        <button type="button" class="bar-chip is-selected" data-bar="dissolved" aria-pressed="true">
          <span class="bar-chip-name">Dissolved Solids</span>
          <span class="bar-chip-loc">Damansara Kim · 周二至周日</span>
        </button>
        <button type="button" class="bar-chip" data-bar="soluble" aria-pressed="false">
          <span class="bar-chip-name">Soluble Solids</span>
          <span class="bar-chip-loc">八打灵再也 SS2 · 周三至周日</span>

      </div>
    </fieldset>

    <fieldset class="reserve-field">
      <legend>选日期</legend>
      <div class="cal-toolbar">
        <button type="button" class="cal-nav reserve-prev" aria-label="上一月">←</button>
        <span class="cal-month" id="reserve-month-label"></span>
        <button type="button" class="cal-nav reserve-next" aria-label="下一月">→</button>
      </div>
      <div class="calendar" id="reserve-calendar" role="grid"></div>
      <p class="cal-legend" id="reserve-closed-label"></p>
      <input type="hidden" id="reserve-date-hidden" name="date" />
    </fieldset>

    <div class="reserve-grid">

      <fieldset class="reserve-field">
        <label for="reserve-time">到达时间</label>
        <input type="time" id="reserve-time" name="time" required />
        <p class="cal-legend" id="reserve-hours-label"></p>
      </fieldset>

      <fieldset class="reserve-field">
        <label for="reserve-pax">人数</label>
        <input type="number" id="reserve-pax" name="pax" min="1" max="20" value="2" required />
      </fieldset>

      <fieldset class="reserve-field">
        <label for="reserve-name">预订姓名</label>
        <input type="text" id="reserve-name" name="name" placeholder="你的名字" required autocomplete="name" />
      </fieldset>

      <fieldset class="reserve-field">
        <label for="reserve-phone">WhatsApp 号码</label>
        <input type="tel" id="reserve-phone" name="phone" placeholder="+60 12 345 6789" required autocomplete="tel" inputmode="tel" />
      </fieldset>

    </div>

    <fieldset class="reserve-field reserve-field-full">
      <label for="reserve-comments">还有什么？（选填）</label>
      <textarea id="reserve-comments" name="comments" rows="3" placeholder="过敏、场合、座位偏好、想做的惊喜。任何我们该知道的事。"></textarea>
    </fieldset>

    <p class="reserve-error" id="reserve-error" hidden></p>

    <button type="submit" class="reserve-submit">→ 通过 WhatsApp 发送预订</button>

    <p class="reserve-note">
      点击提交会打开 WhatsApp 并预填好资料。我们回信确认，营业时段内通常一小时内。即兴到访也欢迎，但有预订桌子会比较稳。
    </p>

  </form>

<script>
(function () {
  'use strict';

  // Closed days use Sun=0, Mon=1, Tue=2, Wed=3, Thu=4, Fri=5, Sat=6 (JS convention)
  // Hours stored as { open: 'HH:MM', close: 'HH:MM' }. close='00:00' means midnight
  // end-of-day. close < open means overnight cross (e.g. 14:00 to 01:00 = open until 1 AM
  // the next day).
  const BARS = {
    dissolved: {
      name: 'Dissolved Solids',
      number: '601140087607',
      closedDays: [1],                      // Closed Monday
      closedLabel: '周一休息',
      hours: {
        0: { open: '14:00', close: '00:00' },  // Sun
        2: { open: '15:00', close: '00:00' },  // Tue
        3: { open: '15:00', close: '00:00' },  // Wed
        4: { open: '15:00', close: '00:00' },  // Thu
        5: { open: '14:00', close: '01:00' },  // Fri
        6: { open: '14:00', close: '01:00' },  // Sat
      }
    },
    soluble: {
      name: 'Soluble Solids',
      number: '601116828651',
      closedDays: [1, 2],                   // Closed Monday and Tuesday
      closedLabel: '周一与周二休息',
      hours: {
        0: { open: '18:00', close: '01:00' },
        3: { open: '18:00', close: '01:00' },
        4: { open: '18:00', close: '01:00' },
        5: { open: '18:00', close: '01:00' },
        6: { open: '18:00', close: '01:00' },
      }
    }
  };

  function timeToMin(t) {
    if (!t) return null;
    const parts = t.split(':');
    return Number(parts[0]) * 60 + Number(parts[1]);
  }
  function isTimeWithinHours(timeStr, hoursObj) {
    if (!timeStr || !hoursObj) return false;
    const t = timeToMin(timeStr);
    const open = timeToMin(hoursObj.open);
    let close = timeToMin(hoursObj.close);
    if (close === 0) close = 24 * 60;
    if (close > open) {
      return t >= open && t < close;
    }
    return t >= open || t < close;
  }
  function fmtHourRange(hoursObj) {
    return hoursObj.open + ' 至 ' + hoursObj.close;
  }

  const today = new Date();
  const todayStart = new Date(today.getFullYear(), today.getMonth(), today.getDate());

  const state = {
    bar: 'dissolved',
    selectedDate: null,
    viewMonth: today.getMonth(),
    viewYear: today.getFullYear(),
  };

  // ---- DOM refs ----
  const $ = (s) => document.querySelector(s);
  const $$ = (s) => Array.from(document.querySelectorAll(s));

  const calEl = $('#reserve-calendar');
  const monthLabel = $('#reserve-month-label');
  const closedLabel = $('#reserve-closed-label');
  const hoursLabel = $('#reserve-hours-label');
  const dateHidden = $('#reserve-date-hidden');
  const errorEl = $('#reserve-error');
  const form = $('.reserve-form');

  // ---- Date helpers ----
  function isClosed(d) {
    return BARS[state.bar].closedDays.indexOf(d.getDay()) !== -1;
  }
  function isPast(d) {
    return d < todayStart;
  }
  function fmtMonth(y, m) {
    return new Date(y, m, 1).toLocaleDateString('zh-Hans-MY', { month: 'long', year: 'numeric' });
  }
  function fmtDateLong(d) {
    return d.toLocaleDateString('zh-Hans-MY', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  }
  function isoDate(d) {
    const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
    return y + '-' + m + '-' + day;
  }

  // ---- Calendar render ----
  function renderCalendar() {
    monthLabel.textContent = fmtMonth(state.viewYear, state.viewMonth);
    closedLabel.textContent = BARS[state.bar].name + ' ' + BARS[state.bar].closedLabel + '。灰色日期不可选。';

    calEl.innerHTML = '';

    // Day headers (Mon-Sun)
    const headerRow = document.createElement('div');
    headerRow.className = 'cal-row cal-headers';
    ['一','二','三','四','五','六','日'].forEach(d => {
      const h = document.createElement('div');
      h.className = 'cal-header';
      h.textContent = d;
      headerRow.appendChild(h);
    });
    calEl.appendChild(headerRow);

    const firstDay = new Date(state.viewYear, state.viewMonth, 1);
    // Convert Sun=0 → 6 (last column), Mon=1 → 0 (first column), etc.
    let startOffset = firstDay.getDay() - 1;
    if (startOffset < 0) startOffset = 6;

    const daysInMonth = new Date(state.viewYear, state.viewMonth + 1, 0).getDate();

    let row = document.createElement('div');
    row.className = 'cal-row';

    for (let i = 0; i < startOffset; i++) {
      const empty = document.createElement('div');
      empty.className = 'cal-cell cal-empty';
      empty.setAttribute('aria-hidden', 'true');
      row.appendChild(empty);
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const date = new Date(state.viewYear, state.viewMonth, day);
      const cell = document.createElement('button');
      cell.type = 'button';
      cell.className = 'cal-cell';
      cell.textContent = day;
      cell.setAttribute('aria-label', fmtDateLong(date));

      const closed = isClosed(date);
      const past = isPast(date);

      if (closed) {
        cell.classList.add('cal-closed');
        cell.disabled = true;
        cell.title = BARS[state.bar].name + ' 当天休息';
      }
      if (past) {
        cell.classList.add('cal-past');
        cell.disabled = true;
        cell.title = '过去日期';
      }
      if (state.selectedDate && date.getTime() === state.selectedDate.getTime()) {
        cell.classList.add('cal-selected');
        cell.setAttribute('aria-pressed', 'true');
      }
      if (date.getTime() === todayStart.getTime()) {
        cell.classList.add('cal-today');
      }

      if (!closed && !past) {
        cell.addEventListener('click', () => selectDate(date));
      }

      row.appendChild(cell);

      if ((startOffset + day) % 7 === 0) {
        calEl.appendChild(row);
        row = document.createElement('div');
        row.className = 'cal-row';
      }
    }

    while (row.children.length > 0 && row.children.length < 7) {
      const empty = document.createElement('div');
      empty.className = 'cal-cell cal-empty';
      empty.setAttribute('aria-hidden', 'true');
      row.appendChild(empty);
    }
    if (row.children.length > 0) calEl.appendChild(row);

    updateHoursLabel();
  }

  function selectDate(date) {
    state.selectedDate = date;
    dateHidden.value = isoDate(date);
    renderCalendar();
    clearError();
  }

  function goToMonth(delta) {
    let m = state.viewMonth + delta;
    let y = state.viewYear;
    if (m < 0) { m = 11; y--; }
    if (m > 11) { m = 0; y++; }
    state.viewMonth = m;
    state.viewYear = y;
    renderCalendar();
  }

  function setBar(bar) {
    state.bar = bar;
    $$('.bar-chip').forEach(c => {
      const sel = c.dataset.bar === bar;
      c.classList.toggle('is-selected', sel);
      c.setAttribute('aria-pressed', sel ? 'true' : 'false');
    });
    if (state.selectedDate && (isClosed(state.selectedDate) || isPast(state.selectedDate))) {
      state.selectedDate = null;
      dateHidden.value = '';
    }
    renderCalendar();
  }

  function updateHoursLabel() {
    if (!state.selectedDate) {
      hoursLabel.textContent = '选好日期后会显示当日营业时间。';
      return;
    }
    const dow = state.selectedDate.getDay();
    const hours = BARS[state.bar].hours[dow];
    const dateStr = state.selectedDate.toLocaleDateString('zh-Hans-MY', { weekday: 'long' });
    if (hours) {
      hoursLabel.textContent = BARS[state.bar].name + ' ' + dateStr + '营业时间 ' + fmtHourRange(hours) + '。请在此时段内选时间。';
    } else {
      hoursLabel.textContent = BARS[state.bar].name + ' ' + dateStr + '休息。';
    }
  }

  function showError(msg) { errorEl.textContent = msg; errorEl.hidden = false; }
  function clearError() { errorEl.hidden = true; }

  // ---- Bindings ----
  $('.reserve-prev').addEventListener('click', () => goToMonth(-1));
  $('.reserve-next').addEventListener('click', () => goToMonth(1));
  $$('.bar-chip').forEach(c => c.addEventListener('click', () => setBar(c.dataset.bar)));

  // Live feedback when arrival time is picked
  $('#reserve-time').addEventListener('change', () => {
    clearError();
    const time = $('#reserve-time').value;
    if (!time || !state.selectedDate) return;
    const hours = BARS[state.bar].hours[state.selectedDate.getDay()];
    if (hours && !isTimeWithinHours(time, hours)) {
      showError(BARS[state.bar].name + ' 当天的营业时间是 ' + fmtHourRange(hours) + '。' + time + ' 在营业时段之外。');
    }
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    clearError();

    const name = $('#reserve-name').value.trim();
    const phone = $('#reserve-phone').value.trim();
    const pax = $('#reserve-pax').value.trim();
    const time = $('#reserve-time').value;
    const comments = $('#reserve-comments').value.trim();
    const date = state.selectedDate;

    if (!date) { showError('请在上方日历中选择日期。'); return; }
    if (!time) { showError('请选择到达时间。'); return; }
    const hours = BARS[state.bar].hours[date.getDay()];
    if (hours && !isTimeWithinHours(time, hours)) {
      showError(BARS[state.bar].name + ' 当天的营业时间是 ' + fmtHourRange(hours) + '。请在此时段内选时间。');
      return;
    }
    if (!pax || Number(pax) < 1) { showError('请告诉我们来几位。'); return; }
    if (!name) { showError('请留下预订姓名。'); return; }
    if (!phone) { showError('请留下 WhatsApp 号码，方便我们确认。'); return; }

    const bar = BARS[state.bar];
    const dateStr = fmtDateLong(date);

    const lines = [
      '*预订请求*',
      '',
      'Hi ' + bar.name + '！我想预订座位。',
      '',
      '姓名：' + name,
      'WhatsApp：' + phone,
      '人数：' + pax + ' 位',
      '日期：' + dateStr,
      '到达时间：' + time,
    ];
    if (comments) {
      lines.push('');
      lines.push('备注：' + comments);
    }
    lines.push('');
    lines.push('谢谢！');

    const url = 'https://wa.me/' + bar.number + '?text=' + encodeURIComponent(lines.join('\n'));
    window.open(url, '_blank', 'noopener');
  });

  // ---- Init ----
  renderCalendar();
})();
</script>
